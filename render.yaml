# Render Blueprint — Quyosh: API (NestJS, bepul web service) + 4 ta frontend (statik sayt). Baza: Neon PostgreSQL, Redis: Upstash.
# Ishlatish: Render → New → Blueprint → shu repo. Faqat `sync: false` qiymatlarni kiritasiz (DATABASE_URL, DIRECT_URL, REDIS_URL,
# ADMIN_PHONE, ADMIN_PASSWORD); qolganini (JWT_SECRET, METRICS_TOKEN, OPS_WEBHOOK_SECRET) Render o'zi yaratadi.
# Batafsil: docs/runbooks/deploy-render.md
#
# Servis nomlari (quyosh-api, quyosh-portal, quyosh-customer, quyosh-shop, quyosh-admin) onrender.com manzillarini belgilaydi.
# Agar nom band bo'lib Render boshqa manzil bersa — ichidagi *.onrender.com qiymatlarni (CORS_ORIGINS, VITE_*, *_PANEL_URL,
# PUBLIC_API_URL) haqiqiy manzillarga almashtiring.
services:
  # ── API (NestJS) ──
  - type: web
    name: quyosh-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - apps/web/**
        - docs/**
    envVars:
      # HOZIRCHA staging: OTP kodi ekranda ko'rinadi (production'da bu taqiqlangan — ilova ishga tushmaydi).
      # Haqiqiy foydalanuvchilarga ochishdan oldin: NODE_ENV=production, OTP_DEV_ECHO* ni o'chiring va SMTP/Eskiz/Telegram ulang.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: staging
      - key: OTP_DEV_ECHO
        value: "true"
      - key: OTP_DEV_ECHO_AUTH
        value: "true"
      - key: TRUST_PROXY            # Render proksi ortida: bitta qatlam (haqiqiy IP rate-limit va audit uchun)
        value: "1"
      # Frontend'lar boshqa (onrender.com) subdomenlarda: cross-site cookie (SameSite=None; Secure) va CORS.
      # Eslatma: Safari/iOS uchinchi tomon cookie'sini bloklaydi — o'z domeningizni ulagach (bir registrable domen) AUTH_COOKIE_SAME_SITE=lax qiling.
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: none
      - key: CORS_ORIGINS
        value: https://quyosh-portal.onrender.com,https://quyosh-customer.onrender.com,https://quyosh-shop.onrender.com,https://quyosh-admin.onrender.com
      - key: PUBLIC_API_URL
        value: https://quyosh-api.onrender.com
      - key: CUSTOMER_PANEL_URL
        value: https://quyosh-customer.onrender.com
      - key: SHOP_PANEL_URL
        value: https://quyosh-shop.onrender.com
      - key: METRICS_DIR
        value: /tmp/quyosh-metrics
      - key: STORAGE_FORCE_PATH_STYLE
        value: "false"              # Cloudflare R2 / AWS S3 uchun; MinIO/s3rver'da "true"
      - key: STORAGE_REGION
        value: auto                 # R2: auto; AWS S3: masalan eu-central-1
      # ── Render o'zi yaratadi (maxfiy) ──
      - key: JWT_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: OPS_WEBHOOK_SECRET
        generateValue: true
      # ── Siz kiritasiz ──
      - key: DATABASE_URL           # Neon POOLED ulanish (host'da -pooler), oxirida: ?sslmode=require&pgbouncer=true&connect_timeout=15&connection_limit=5
        sync: false
      - key: DIRECT_URL             # Neon DIRECT ulanish (pooler'siz) — faqat migratsiya/seed uchun (build'da)
        sync: false
      - key: REDIS_URL              # Upstash: rediss://default:<parol>@<host>.upstash.io:6379
        sync: false
      - key: ADMIN_PHONE            # birinchi super admin (seed faqat baza bo'sh bo'lganda ishlaydi), masalan 998901234567
        sync: false
      - key: ADMIN_PASSWORD         # kamida 12 belgi
        sync: false
      # ── Keyinroq (hozircha bo'sh qolishi mumkin) ──
      # S3-mos saqlash: bo'sh bo'lsa ilova ishlaydi, lekin rasm/fayl yuklash ishlamaydi (Cloudflare R2: https://<account>.r2.cloudflarestorage.com).
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      # Kod yetkazish (production'ga o'tishda kamida bittasi kerak)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ESKIZ_EMAIL
        sync: false
      - key: ESKIZ_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OTP_CHAT_ID
        sync: false

  # ── portal: asosiy sayt (faqat mijoz uchun tushuntirish) ──
  - type: web
    name: quyosh-portal
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npx vite build
    staticPublishPath: dist
    buildFilter:
      paths:
        - apps/web/**
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(self), geolocation=(self), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        value: https://quyosh-api.onrender.com/api/v1
      - key: VITE_CUSTOMER_URL
        value: https://quyosh-customer.onrender.com

  # ── customer: customer paneli ──
  - type: web
    name: quyosh-customer
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npx vite build --mode customer
    staticPublishPath: dist
    buildFilter:
      paths:
