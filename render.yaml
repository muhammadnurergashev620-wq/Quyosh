# Render Blueprint — Quyosh API (NestJS) bepul tarifda. Baza: Neon PostgreSQL, Redis: Upstash.
# Ishlatish: Render → New → Blueprint → shu repo. `sync: false` qiymatlarni dashboard'da o'zingiz kiritasiz (repo'ga yozilmaydi).
# Batafsil qadamlar: docs/runbooks/deploy-render.md
services:
  - type: web
    name: quyosh-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # ── Qat'iy qiymatlar (maxfiy emas) ──
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY            # Render proksi ortida: bitta qatlam (haqiqiy IP rate-limit va audit uchun)
        value: "1"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: METRICS_DIR
        value: /tmp/quyosh-metrics
      - key: STORAGE_FORCE_PATH_STYLE
        value: "false"              # Cloudflare R2 / AWS S3 uchun; MinIO/s3rver'da "true"
      - key: STORAGE_REGION
        value: auto                 # R2: auto; AWS S3: masalan eu-central-1
      # ── Maxfiy yoki muhitga bog'liq (qiymatlarni dashboard'da kiriting) ──
      - key: DATABASE_URL           # Neon POOLED ulanish (host'da -pooler), oxirida: ?sslmode=require&pgbouncer=true&connect_timeout=15&connection_limit=5
        sync: false
      - key: DIRECT_URL             # Neon DIRECT ulanish (pooler'siz) — faqat migratsiya/seed uchun (build'da)
        sync: false
      - key: REDIS_URL              # Upstash: rediss://default:<parol>@<host>.upstash.io:6379
        sync: false
      - key: JWT_SECRET             # kamida 32 belgi, tasodifiy (masalan: openssl rand -base64 48)
        sync: false
      - key: CORS_ORIGINS           # faqat https, vergul bilan: frontend manzillari
        sync: false
      - key: PUBLIC_API_URL         # bu servisning https manzili (vidjet/embed havolalari uchun)
        sync: false
      - key: CUSTOMER_PANEL_URL
        sync: false
      - key: SHOP_PANEL_URL
        sync: false
      - key: AUTH_COOKIE_SAME_SITE  # frontend boshqa domenda bo'lsa: none; bir sayt (bir registrable domen) bo'lsa: lax
        sync: false
      - key: STORAGE_ENDPOINT       # S3-mos saqlash (Cloudflare R2: https://<account>.r2.cloudflarestorage.com)
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: OPS_WEBHOOK_SECRET
        sync: false
      # ── Faqat birinchi deploy uchun (keyin RUN_SEED va ADMIN_PASSWORD ni o'chiring) ──
      - key: RUN_SEED
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD         # kamida 12 belgi
        sync: false
      # ── Kod yetkazish (kamida bittasi kerak, aks holda OTP kodni foydalanuvchiga yetkazib bo'lmaydi) ──
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ESKIZ_EMAIL
        sync: false
      - key: ESKIZ_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN     # ixtiyoriy: operatorga OTP nusxasi va alertlar
        sync: false
      - key: TELEGRAM_OTP_CHAT_ID
        sync: false
