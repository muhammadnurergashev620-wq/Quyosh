name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — prisma, type-check, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build

  integration:
    name: Backend — integration tests (Postgres 18 + PostGIS, Redis, S3)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_BASE_URL: postgresql://ci:ci@localhost:5432
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_STORAGE_ENDPOINT: http://localhost:9000
      TEST_STORAGE_ACCESS_KEY_ID: ci-minio
      TEST_STORAGE_SECRET_ACCESS_KEY: ci-minio-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-minio-secret minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - run: pnpm vitest run tests/integration

  web:
    name: Web — type-check, lint, unit tests, build (customer/shop/admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build all panels
        run: |
          for mode in customer shop admin; do
            npx vite build --mode "$mode" --outDir "dist-$mode"
          done

  dependency-audit:
    name: Dependency audit (high/critical blocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Backend — production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Web — production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  migration-safety:
    name: Destructive migrations need an acknowledgment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed migrations
        run: bash scripts/check-migrations.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
